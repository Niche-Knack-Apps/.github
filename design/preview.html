<!doctype html>
<!-- Local preview of profile/README.md framed like GitHub's organization page.
     Serve the repo root (python3 -m http.server 8791 --bind 127.0.0.1) and open
     http://127.0.0.1:8791/design/preview.html  (add ?theme=dark for dark mode). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche-Knack org page preview</title>
<base href="../profile/">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; --box: #ffffff; }
  :root[data-theme="dark"] { --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --link: #4493f8; --box: #0d1117; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  header { display: flex; gap: 16px; align-items: center; max-width: 1280px; margin: 0 auto; padding: 24px 32px 16px; }
  header img { width: 100px; height: 100px; border-radius: 6px; border: 1px solid var(--border); }
  header h1 { font-size: 24px; font-weight: 600; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); }
  header .toggle { margin-left: auto; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  main { max-width: 1280px; margin: 0 auto; padding: 0 32px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
  .readme { border: 1px solid var(--border); border-radius: 6px; padding: 24px 32px; background: var(--box); }
  .readme .label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-bottom: 16px; }
  .readme p { margin: 0 0 16px; }
  .readme a { color: var(--link); text-decoration: none; }
  .readme img { max-width: 100%; vertical-align: middle; }
  .readme code { font: 85% ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(129,139,152,.15); padding: .2em .4em; border-radius: 6px; }
  aside { color: var(--muted); }
  aside h2 { font-size: 16px; color: var(--fg); margin: 0 0 8px; }
  aside li { margin-bottom: 6px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <img src="../design/preview-avatar.png" alt="">
  <div><h1>Niche-Knack Apps</h1><p>Smart Tools. Sharp Solutions. Apps for narrow needs … — nk.tools</p></div>
  <button class="toggle" type="button" id="toggle">Dark</button>
</header>
<main>
  <section class="readme"><div class="label">README.md</div><div id="readme">Loading…</div></section>
  <aside><h2>Repositories</h2><ul><li>.github</li><li>z9s</li><li>nines</li></ul></aside>
</main>
<script>
  const root = document.documentElement;
  const button = document.getElementById('toggle');
  const set = (t) => { root.dataset.theme = t; button.textContent = t === 'dark' ? 'Light' : 'Dark'; };
  set(new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light');
  button.addEventListener('click', () => set(root.dataset.theme === 'dark' ? 'light' : 'dark'));
  fetch('README.md', { cache: 'no-store' }).then((r) => r.text()).then((t) => { document.getElementById('readme').innerHTML = t; });
</script>
</body>
</html>
